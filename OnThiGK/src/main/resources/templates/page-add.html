<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Page Mới - Dashboard NTU</title>
    <style>
        /* Thiết lập chung và Layout (giống các trang trước) */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; flex-direction: column; min-height: 100vh; outline: 1px solid #000; margin: 2px; }
        header { display: flex; border-bottom: 1px solid #000; height: 80px; }
        .logo-section { width: 250px; padding: 10px; border-right: 1px solid #000; display: flex; align-items: center; gap: 10px; }
        .logo-section img { height: 50px; }
        .school-info { font-size: 11px; font-weight: bold; color: #d32f2f; line-height: 1.2; }
        .user-section { flex-grow: 1; display: flex; justify-content: flex-end; align-items: center; padding-right: 30px; font-size: 18px; font-weight: bold; }
        .main-container { display: flex; flex-grow: 1; }
        nav { width: 250px; border-right: 1px solid #000; background-color: #fff; }
        nav ul { list-style: none; }
        nav ul li { border-bottom: 1px solid #000; min-height: 45px; display: flex; align-items: center; }
        nav ul li a { text-decoration: none; color: #000; padding: 10px 15px; width: 100%; display: block; }
        nav ul li:first-child a { font-weight: bold; font-size: 1.1em; }
        nav ul li:hover { background-color: #f0f0f0; }
        footer { border-top: 1px solid #000; text-align: center; padding: 10px; font-size: 14px; background: #fff; }
        
        /* CSS Dành riêng cho Form Thêm Mới */
        main { flex-grow: 1; background-color: #fff; padding: 30px; color: #333; }
        .form-container { max-width: 600px; margin: 0 auto; border: 1px solid #ccc; padding: 25px; border-radius: 5px; background-color: #f9f9f9;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .form-group textarea { resize: vertical; height: 120px; }
        .btn-submit { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background-color: #218838; }
        .btn-cancel { text-decoration: none; color: #dc3545; margin-left: 15px; font-weight: bold; }
        .btn-cancel:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <img th:src="@{/images/logo.png}" alt="NTU Logo">
            <div class="school-info">
                TRƯỜNG ĐẠI HỌC NHA TRANG<br>
                KHOA CÔNG NGHỆ THÔNG TIN
            </div>
        </div>
        <div class="user-section">
            <span th:text="${username != null ? username : 'Guest'}"></span>
        </div>
    </header>

    <div class="main-container">
        <nav>
            <ul>
                <li><a th:href="@{/}">Dashboard</a></li>
                <li><a th:href="@{/page/all}">Page - List</a></li>
                <li><a th:href="@{/page/new}">Page - Addnew</a></li>
                <li><a th:href="@{/post/all}">Post - List</a></li>
                <li><a th:href="@{/post/new}">Post - Addnew</a></li>
                <li><a>&nbsp;</a></li>
                <li><a>&nbsp;</a></li>
            </ul>
        </nav>

        <main>
            <div class="form-container">
                <h2 style="text-align: center; margin-bottom: 25px;">Thêm Page Mới</h2>
                
                <form th:action="@{/page/new}" method="POST" th:object="${page}">
                    
                    <div class="form-group">
                        <label for="pageName">Tên trang (Page Name):</label>
                        <input type="text" id="pageName" th:field="*{pageName}" required placeholder="Nhập tên trang...">
                    </div>
                    
                    <div class="form-group">
                        <label for="keyword">Từ khóa (Keyword):</label>
                        <input type="text" id="keyword" th:field="*{keyword}" placeholder="Ví dụ: tin-tuc, gioi-thieu...">
                    </div>
                    
                    <div class="form-group">
                        <label for="parentPageId">ID Trang cha (Parent Page ID):</label>
                        <input type="number" id="parentPageId" th:field="*{parentPageId}" placeholder="Để trống nếu là trang gốc">
                    </div>
                    
                    <div class="form-group">
                        <label for="content">Nội dung (Content):</label>
                        <textarea id="content" th:field="*{content}" required placeholder="Nhập nội dung trang..."></textarea>
                    </div>
                    
                    <div style="text-align: center; margin-top: 20px;">
                        <button type="submit" class="btn-submit">Lưu lại</button>
                        <a th:href="@{/page/all}" class="btn-cancel">Hủy bỏ</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer>
        ©2026 by 65133958 – FIT.NTU
    </footer>

</body>
</html>
