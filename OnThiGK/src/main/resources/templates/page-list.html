<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Dashboard - NTU</title>
    <style>
        /* Thiết lập chung */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* Tạo viền bao quanh toàn bộ trang */
            outline: 1px solid #000;
            margin: 2px;
        }

        /* Header */
        header {
            display: flex;
            border-bottom: 1px solid #000;
            height: 80px;
        }

        .logo-section {
            width: 250px;
            padding: 10px;
            border-right: 1px solid #000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-section img {
            height: 50px;
        }

        .school-info {
            font-size: 11px;
            font-weight: bold;
            color: #d32f2f;
            line-height: 1.2;
        }

        .user-section {
            flex-grow: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-right: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Body Container */
        .main-container {
            display: flex;
            flex-grow: 1;
        }

        /* Sidebar */
        nav {
            width: 250px;
            border-right: 1px solid #000;
            background-color: #fff;
        }

        nav ul {
            list-style: none;
        }

        nav ul li {
            border-bottom: 1px solid #000;
            min-height: 45px;
            display: flex;
            align-items: center;
        }

        nav ul li a {
            text-decoration: none;
            color: #000;
            padding: 10px 15px;
            width: 100%;
            display: block;
        }

        nav ul li:first-child a {
            font-weight: bold;
            font-size: 1.1em;
        }

        nav ul li:hover {
            background-color: #f0f0f0;
        }

        /* Content Area */
        main {
            flex-grow: 1;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: #888;
            font-weight: bold;
        }

        /* Footer */
        footer {
            border-top: 1px solid #000;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            background: #fff;
        }
    </style>
</head>
<body>

<nav>
    <ul>
        <li><a th:href="@{/}">Dashboard</a></li>
        <li><a th:href="@{/page/all}">Page - List</a></li>
        <li><a th:href="@{/page/new}">Page - Addnew</a></li>
        <li><a th:href="@{/post/all}">Post - List</a></li>
        <li><a th:href="@{/post/new}">Post - Addnew</a></li>
        <li><a>&nbsp;</a></li>
    </ul>
</nav>

<main style="display: block; padding: 20px;"> <h2 style="color: black; margin-bottom: 20px;">Danh sách Page</h2>
    
    <table border="1" style="width: 100%; border-collapse: collapse; text-align: center; font-size: 16px; color: black;">
        <thead>
            <tr style="background-color: #f0f0f0;">
                <th style="padding: 10px;">id</th>
                <th style="padding: 10px;">Pagename</th>
                <th style="padding: 10px;">parentPageId</th>
                <th style="padding: 10px;">Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="page : ${pages}">
                <td style="padding: 10px;" th:text="${page.id}"></td>
                <td style="padding: 10px;" th:text="${page.pageName}"></td>
                <td style="padding: 10px;" th:text="${page.parentPageId}"></td>
                <td style="padding: 10px;">
                    <a th:href="@{/page/view/{id}(id=${page.id})}">[view]</a>
<a th:href="@{/page/edit/{id}(id=${page.id})}">[edit]</a>
                    <a th:href="@{/page/delete/{id}(id=${page.id})}" onclick="return confirm('Bạn có chắc muốn xóa trang này?');">[delete]</a>
                </td>
            </tr>
        </tbody>
    </table>
</main>

</body>
</html>
