<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:replace="~{layout :: layout(~{::main})}">
        <main>
            <h2>Thêm mới Page</h2>
            <form th:action="@{/page/new}" method="post" style="max-width: 400px;">
                <div style="margin-bottom: 10px;">
                    <label>ID:</label><br>
                    <input type="number" name="id" required style="width: 100%;" />
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label>Page Name:</label><br>
                    <input type="text" name="pageName" required style="width: 100%;" />
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label>Keyword:</label><br>
                    <input type="text" name="keyword" style="width: 100%;" />
                </div>
                
                <div style="margin-bottom: 10px;">
                    <label>Content:</label><br>
                    <textarea name="content" rows="4" style="width: 100%;"></textarea>
                </div>
                
                <div style="margin-bottom: 15px;">
                    <label>Parent Page ID (Có thể bỏ trống):</label><br>
                    <input type="number" name="parentPageId" style="width: 100%;" />
                </div>
                
                <button type="submit" style="padding: 5px 15px;">Lưu Page</button>
                <a th:href="@{/page/all}" style="margin-left: 10px;">Hủy</a>
            </form>
        </main>
    </div>
</body>
</html>
