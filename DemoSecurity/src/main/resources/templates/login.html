<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Đăng nhập</title></head>
<body>
    <h2>Trang Đăng Nhập</h2>
    <div th:if="${param.error}" style="color:red">Sai tài khoản hoặc mật khẩu!</div>
    <div th:if="${param.logout}" style="color:green">Bạn đã đăng xuất thành công.</div>
    
    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Username (user/admin)" required><br><br>
        <input type="password" name="password" placeholder="Password" required><br><br>
        <button type="submit">Đăng nhập</button>
    </form>
    <p>Gợi ý: user/123 hoặc admin/123456</p>
</body>
</html>
