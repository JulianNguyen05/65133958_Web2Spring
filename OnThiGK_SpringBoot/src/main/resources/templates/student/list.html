<!DOCTYPE html>
<html th:replace="~{layout :: html(content=~{::div})}">
<body>
    <div>
        <h3>Student List</h3>
        <table style="width: 100%; text-align: left;">
            <thead>
                <tr>
                    <th>id</th>
                    <th>Name</th>
                    <th>groupId</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.groupId}"></td>
                    <td>
                        <a th:href="@{/student/view/{id}(id=${student.id})}">[view]</a>
                        <a href="#">[edit]</a> <a th:href="@{/student/delete/{id}(id=${student.id})}" onclick="return confirm('Bạn có chắc muốn xóa sinh viên này?');">[delete]</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
