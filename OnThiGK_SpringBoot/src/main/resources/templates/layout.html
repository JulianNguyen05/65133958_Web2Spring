<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đồ Án</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* CSS nội tuyến bổ sung cho giống layout đề bài */
        .layout-container { display: flex; min-height: 100vh; border: 1px solid #000; }
        .sidebar { width: 200px; border-right: 1px solid #000; padding: 10px; }
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .header { border-bottom: 1px solid #000; padding: 10px; display: flex; justify-content: space-between; }
        .footer { border-top: 1px solid #000; padding: 10px; text-align: center; margin-top: auto; }
        .content { padding: 20px; }
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; }
    </style>
</head>
<body>
    <div class="layout-container">
        <div class="sidebar">
            <ul style="list-style-type: none; padding: 0;">
                <li><a th:href="@{/dashboard}">Dashboard</a></li>
                <li><hr></li>
                <li><a th:href="@{/topic/all}">Topic - List</a></li>
                <li><a th:href="@{/topic/new}">Topic - Addnew</a></li>
                <li><hr></li>
                <li><a th:href="@{/student/all}">Student - List</a></li>
                <li><a th:href="@{/student/new}">Student - Addnew</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header">
                <div>TRƯỜNG ĐẠI HỌC NHA TRANG<br><b>KHOA CÔNG NGHỆ THÔNG TIN</b></div>
                <div>[UserName]</div> </div>

            <div class="content">
                <div th:replace="${content}"></div>
            </div>

            <div class="footer">
                ©2025 by Student Name – FIT.NTU
            </div>
        </div>
    </div>
</body>
</html>
