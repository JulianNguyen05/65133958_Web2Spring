<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Loại Sản Phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center py-10">

    <div class="w-full max-w-4xl px-4 fade-in">
        
        <div class="flex space-x-2 mb-4">
            <a href="/admin/dashboard" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium transition-colors flex items-center">
                <i data-lucide="home" class="w-4 h-4 mr-2"></i> Trang Chủ
            </a>
            <a href="/admin/san-pham" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium transition-colors flex items-center">
                <i data-lucide="package" class="w-4 h-4 mr-2"></i> Sản Phẩm
            </a>
            <a href="/admin/loai-san-pham" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium shadow-md flex items-center">
                <i data-lucide="tags" class="w-4 h-4 mr-2"></i> Loại Sản Phẩm
            </a>
        </div>

        <div class="bg-white rounded-t-2xl shadow-sm border-b border-gray-100 p-6 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-500 p-2 rounded-lg text-white shadow-md">
                    <i data-lucide="tags"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Danh Mục Loại</h1>
                </div>
            </div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-5 rounded-lg transition-colors flex items-center space-x-2 shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i><span>Thêm mới</span>
            </button>
        </div>

        <div class="bg-white rounded-b-2xl shadow-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b border-gray-200">
                        <th class="py-4 px-6 font-semibold w-24">ID</th>
                        <th class="py-4 px-6 font-semibold">Tên Loại Sản Phẩm</th>
                        <th class="py-4 px-6 font-semibold text-center w-32">Thao tác</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100 text-sm">
                    <tr th:each="loai : ${listLoai}" class="hover:bg-indigo-50/50 transition-colors duration-200 group">
                        <td class="py-4 px-6 text-gray-500 font-medium" th:text="${'#' + loai.id}"></td>
                        <td class="py-4 px-6 font-medium text-gray-900" th:text="${loai.tenLoai}"></td>
                        <td class="py-4 px-6 text-center space-x-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                            <button title="Sửa" th:attr="onclick=|openModal('${loai.id}', '${loai.tenLoai}')|" class="text-gray-400 hover:text-indigo-600 p-1">
                                <i data-lucide="file-edit" class="w-5 h-5"></i>
                            </button>
                            <button title="Xóa" th:attr="onclick=|xoaLoai('${loai.id}')|" class="text-gray-400 hover:text-red-600 p-1">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listLoai)}">
                        <td colspan="3" class="py-12 text-center text-gray-500">Chưa có loại sản phẩm nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="crudModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold text-gray-900" id="modalTitle">Thêm Loại</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="categoryForm" onsubmit="event.preventDefault(); saveLoai();">
                <input type="hidden" id="loaiId">
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tên Loại</label>
                    <input type="text" id="loaiTen" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Hủy</button>
                    <button type="submit" class="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let isEditMode = false;

        function openModal(id = '', ten = '') {
            isEditMode = !!id;
            document.getElementById('modalTitle').innerText = isEditMode ? 'Cập Nhật Loại' : 'Thêm Loại Mới';
            document.getElementById('loaiId').value = id;
            document.getElementById('loaiTen').value = ten;
            document.getElementById('crudModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('crudModal').classList.add('hidden');
            document.getElementById('categoryForm').reset();
        }

        function saveLoai() {
            const id = document.getElementById('loaiId').value;
            const data = { tenLoai: document.getElementById('loaiTen').value };
            const url = isEditMode ? `/api/admin/loai-san-pham/${id}` : '/api/admin/loai-san-pham';
            
            fetch(url, {
                method: isEditMode ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => {
                if(res.ok) window.location.reload();
                else alert('Lỗi hệ thống!');
            });
        }

        function xoaLoai(id) {
            if(confirm('Chắc chắn xóa loại này?')) {
                fetch(`/api/admin/loai-san-pham/${id}`, { method: 'DELETE' })
                .then(res => {
                    if(res.ok) window.location.reload();
                    else alert('Không thể xóa. Loại này có thể đang chứa sản phẩm!');
                });
            }
        }
    </script>
</body>
</html>
