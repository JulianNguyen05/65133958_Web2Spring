<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col items-center py-10">

    <div class="w-full max-w-5xl px-4 fade-in">
        
        <div class="flex space-x-2 mb-4">
            <a href="/admin/dashboard" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium transition-colors flex items-center">
                <i data-lucide="home" class="w-4 h-4 mr-2"></i> Trang Chủ
            </a>
            <a href="/admin/san-pham" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow-md flex items-center">
                <i data-lucide="package" class="w-4 h-4 mr-2"></i> Sản Phẩm
            </a>
            <a href="/admin/loai-san-pham" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium transition-colors flex items-center">
                <i data-lucide="tags" class="w-4 h-4 mr-2"></i> Loại Sản Phẩm
            </a>
        </div>

        <div class="bg-white rounded-t-2xl shadow-sm border-b border-gray-100 p-6 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-500 p-2 rounded-lg text-white shadow-md">
                    <i data-lucide="box"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Quản lý Sản phẩm</h1>
                </div>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg transition-colors flex items-center space-x-2 shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Thêm mới</span>
            </button>
        </div>

        <div class="bg-white rounded-b-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm uppercase tracking-wider border-b border-gray-200">
                            <th class="py-4 px-6 font-semibold">ID</th>
                            <th class="py-4 px-6 font-semibold">Tên Sản Phẩm</th>
                            <th class="py-4 px-6 font-semibold">Giá (VNĐ)</th>
                            <th class="py-4 px-6 font-semibold">Loại Sản Phẩm</th>
                            <th class="py-4 px-6 font-semibold text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <tr th:each="sp : ${listSanPham}" class="hover:bg-blue-50/50 transition-colors duration-200 group">
                            <td class="py-4 px-6 text-gray-500 font-medium" th:text="${'#' + sp.id}"></td>
                            <td class="py-4 px-6 font-medium text-gray-900" th:text="${sp.tenSanPham}"></td>
                            <td class="py-4 px-6 text-blue-600 font-semibold" th:text="${#numbers.formatDecimal(sp.gia, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                            <td class="py-4 px-6">
                                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800"
                                      th:text="${sp.loaiSanPham != null ? sp.loaiSanPham.tenLoai : 'Chưa phân loại'}">
                                </span>
                            </td>
                            <td class="py-4 px-6 text-center space-x-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                                <button title="Sửa" class="text-gray-400 hover:text-blue-600 transition-colors p-1"
                                        th:attr="onclick=|openModal('${sp.id}', '${sp.tenSanPham}', '${sp.gia}', '${sp.loaiSanPham != null ? sp.loaiSanPham.id : ''}')|">
                                    <i data-lucide="file-edit" class="w-5 h-5"></i>
                                </button>
                                <button title="Xóa" class="text-gray-400 hover:text-red-600 transition-colors p-1" th:attr="onclick=|xoaSanPham('${sp.id}')|">
                                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listSanPham)}">
                            <td colspan="5" class="py-12 text-center text-gray-500">
                                <p>Chưa có sản phẩm nào. Hãy thêm mới!</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="crudModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center transition-opacity">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md mx-4">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold text-gray-900" id="modalTitle">Thêm Sản Phẩm</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="productForm" onsubmit="event.preventDefault(); saveSanPham();">
                <input type="hidden" id="spId">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tên Sản Phẩm</label>
                    <input type="text" id="spTen" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Giá (VNĐ)</label>
                    <input type="number" id="spGia" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Loại Sản Phẩm</label>
                    <select id="spLoaiId" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option value="" disabled selected>-- Chọn Loại Sản Phẩm --</option>
                        <option th:each="loai : ${listLoai}" th:value="${loai.id}" th:text="${loai.tenLoai}"></option>
                    </select>
                </div>
                
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg">Hủy</button>
                    <button type="submit" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let isEditMode = false;

        function openModal(id = '', ten = '', gia = '', loaiId = '') {
            isEditMode = !!id;
            document.getElementById('modalTitle').innerText = isEditMode ? 'Cập Nhật Sản Phẩm' : 'Thêm Sản Phẩm Mới';
            document.getElementById('spId').value = id;
            document.getElementById('spTen').value = ten;
            document.getElementById('spGia').value = gia;
            document.getElementById('spLoaiId').value = loaiId;
            document.getElementById('crudModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('crudModal').classList.add('hidden');
            document.getElementById('productForm').reset();
        }

        function saveSanPham() {
            const id = document.getElementById('spId').value;
            const data = {
                tenSanPham: document.getElementById('spTen').value,
                gia: parseFloat(document.getElementById('spGia').value),
                loaiSanPham: { id: parseInt(document.getElementById('spLoaiId').value) } 
            };

            const url = isEditMode ? `/api/admin/san-pham/${id}` : '/api/admin/san-pham';
            fetch(url, {
                method: isEditMode ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(res => {
                if(res.ok) window.location.reload();
                else alert('Lỗi khi lưu!');
            });
        }

        function xoaSanPham(id) {
            if(confirm(`Xóa sản phẩm #${id}?`)) {
                fetch(`/api/admin/san-pham/${id}`, { method: 'DELETE' })
                .then(res => {
                    if(res.ok) window.location.reload();
                    else alert('Lỗi khi xóa!');
                });
            }
        }
    </script>
</body>
</html>
